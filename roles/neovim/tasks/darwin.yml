# macOS: neovim via Homebrew (unpinned — D001). On mac the nvim binary lands
# on PATH directly, so conf/.zshrc's /opt/nvim-linux-x86_64 guard never fires.
- name: Install neovim via Homebrew
  community.general.homebrew:
    name: neovim
    state: present
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ lookup('ansible.builtin.env', 'PATH') }}"
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_ANALYTICS: "1"
  tags: [neovim]
