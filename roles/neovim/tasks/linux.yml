# Neovim pinned to /opt (sha256-verified). get_url's checksum makes the
# download idempotent; remove+unarchive only run when the download changed.
- name: Download neovim v{{ neovim_version }}
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "/tmp/nvim-v{{ neovim_version }}.tar.gz"
    checksum: "sha256:{{ neovim_sha256 }}"
    mode: "0644"
  register: neovim_download
  tags: [neovim]

- name: Remove old neovim installation
  become: true
  ansible.builtin.file:
    path: /opt/nvim-linux-x86_64
    state: absent
  when: neovim_download.changed
  tags: [neovim]

- name: Unarchive neovim
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/nvim-v{{ neovim_version }}.tar.gz"
    dest: /opt
    remote_src: true
  when: neovim_download.changed
  tags: [neovim]
