# lazygit pinned (sha256-verified), installed user-local to ~/.local/bin — no
# sudo (D009).
#
# Idempotency: a version check (binary present AND --version output contains
# the target version) skips download/extract/install entirely. Without it, the
# /tmp dest would re-download + re-extract every run once /tmp is cleared, even
# when the version is current (mirrors the neovim role's fix).

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [lazygit]

- name: Check installed lazygit version
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.local/bin/lazygit --version"
  register: lazygit_current
  changed_when: false
  failed_when: false
  tags: [lazygit]

- name: Download lazygit v{{ lazygit_version }}
  ansible.builtin.get_url:
    url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
    dest: "/tmp/lazygit-v{{ lazygit_version }}.tar.gz"
    checksum: "sha256:{{ lazygit_sha256 }}"
    mode: "0644"
  register: lazygit_download
  when: "lazygit_version not in lazygit_current.stdout"
  tags: [lazygit]

- name: Create lazygit extract directory
  ansible.builtin.file:
    path: "/tmp/lazygit-v{{ lazygit_version }}_extract"
    state: directory
    mode: "0755"
  when: "lazygit_version not in lazygit_current.stdout"
  tags: [lazygit]

- name: Extract lazygit
  ansible.builtin.unarchive:
    src: "/tmp/lazygit-v{{ lazygit_version }}.tar.gz"
    dest: "/tmp/lazygit-v{{ lazygit_version }}_extract"
    remote_src: true
  when: "lazygit_version not in lazygit_current.stdout"
  tags: [lazygit]

- name: Install lazygit binary to ~/.local/bin
  ansible.builtin.copy:
    src: "/tmp/lazygit-v{{ lazygit_version }}_extract/lazygit"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/lazygit"
    mode: "0755"
    remote_src: true
  when: "lazygit_version not in lazygit_current.stdout"
  tags: [lazygit]
