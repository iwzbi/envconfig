- name: Download lazygit archive
  ansible.builtin.get_url:
    url: 'https://github.com/jesseduffield/lazygit/releases/download/v0.44.1/lazygit_0.44.1_Linux_x86_64.tar.gz'
    dest: /tmp/lazygit.tar.gz
    checksum: sha256:84682f4ad5a449d0a3ffbc8332200fe8651aee9dd91dcd8d87197ba6c2450dbc
  tags: [lazygit]

- name: Create lazygit extract directory
  ansible.builtin.file:
    path: /tmp/lazygit_extract
    state: directory
    mode: '0755'
  tags: [lazygit]

- name: Extract lazygit (to temp)
  ansible.builtin.unarchive:
    src: /tmp/lazygit.tar.gz
    dest: /tmp/lazygit_extract
    creates: /tmp/lazygit_extract/lazygit
  tags: [lazygit]

- name: Install lazygit binary
  become: true
  ansible.builtin.copy:
    src: /tmp/lazygit_extract/lazygit
    dest: /usr/local/bin/lazygit
    mode: '0755'
    remote_src: yes
  tags: [lazygit]
