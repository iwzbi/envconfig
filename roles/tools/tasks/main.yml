---
# Modern CLI tools installed via binary download (not in apt or faster than cargo).
# apt-installable tools (bat, jq, btop, direnv, gh) are in the packages role.
# eza is installed here because it's not in Ubuntu 22.04 apt repos.
# Version numbers are centralized in defaults/main.yml.

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: '{{ ansible_facts.user_dir }}/.local/bin'
    state: directory
    mode: '0755'
  tags: [tools]

# --- batcat symlink (Ubuntu/Debian names the bat binary 'batcat') ---
- name: Symlink batcat to bat (Ubuntu quirk)
  ansible.builtin.shell: |
    [ -f /usr/bin/batcat ] && ln -sf /usr/bin/batcat /usr/local/bin/bat || true
  become: yes
  changed_when: false
  tags: [tools]

# --- delta: syntax-highlighting pager for git diff ---
- name: Download delta v{{ delta_version }}
  ansible.builtin.get_url:
    url: 'https://github.com/dandavison/delta/releases/download/{{ delta_version }}/git-delta_{{ delta_version }}_amd64.deb'
    dest: '/tmp/delta-{{ delta_version }}.deb'
  register: delta_download
  tags: [tools]

- name: Install delta
  become: yes
  ansible.builtin.shell: dpkg -i '/tmp/delta-{{ delta_version }}.deb'
  when: delta_download.changed
  tags: [tools]

# --- zoxide: smarter cd (Rust, replaces autojump) ---
- name: Download zoxide v{{ zoxide_version }}
  ansible.builtin.get_url:
    url: 'https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-x86_64-unknown-linux-musl.tar.gz'
    dest: '/tmp/zoxide-v{{ zoxide_version }}.tar.gz'
  register: zoxide_download
  tags: [tools]

- name: Create zoxide extract directory
  ansible.builtin.file:
    path: '/tmp/zoxide-v{{ zoxide_version }}_extract'
    state: directory
    mode: '0755'
  when: zoxide_download.changed
  tags: [tools]

- name: Extract zoxide
  ansible.builtin.unarchive:
    src: '/tmp/zoxide-v{{ zoxide_version }}.tar.gz'
    dest: '/tmp/zoxide-v{{ zoxide_version }}_extract'
    remote_src: yes
  when: zoxide_download.changed
  tags: [tools]

- name: Install zoxide binary
  ansible.builtin.copy:
    src: '/tmp/zoxide-v{{ zoxide_version }}_extract/zoxide'
    dest: '{{ ansible_facts.user_dir }}/.local/bin/zoxide'
    mode: '0755'
    remote_src: yes
  when: zoxide_download.changed
  tags: [tools]

# --- eza: modern ls replacement (not in Ubuntu 22.04 apt) ---
- name: Download eza v{{ eza_version }}
  ansible.builtin.get_url:
    url: 'https://github.com/eza-community/eza/releases/download/v{{ eza_version }}/eza_x86_64-unknown-linux-musl.tar.gz'
    dest: '/tmp/eza-v{{ eza_version }}.tar.gz'
  register: eza_download
  tags: [tools]

- name: Create eza extract directory
  ansible.builtin.file:
    path: '/tmp/eza-v{{ eza_version }}_extract'
    state: directory
    mode: '0755'
  when: eza_download.changed
  tags: [tools]

- name: Extract eza
  ansible.builtin.unarchive:
    src: '/tmp/eza-v{{ eza_version }}.tar.gz'
    dest: '/tmp/eza-v{{ eza_version }}_extract'
    remote_src: yes
  when: eza_download.changed
  tags: [tools]

- name: Install eza binary
  ansible.builtin.copy:
    src: '/tmp/eza-v{{ eza_version }}_extract/eza'
