# Modern CLI tools installed via binary download (not in apt or faster than cargo).
# apt-installable tools (bat, eza, jq, btop, direnv, gh) are in the packages role.

# --- batcat symlink (Ubuntu/Debian names the bat binary 'batcat') ---
- name: Symlink batcat to bat (Ubuntu quirk)
  ansible.builtin.shell: |
    [ -f /usr/bin/batcat ] && ln -sf /usr/bin/batcat /usr/local/bin/bat || true
  become: yes
  changed_when: false
  tags: [tools]

# --- delta: syntax-highlighting pager for git diff ---
- name: Download delta .deb
  ansible.builtin.get_url:
    url: 'https://github.com/dandavison/delta/releases/download/0.19.2/git-delta_0.19.2_amd64.deb'
    dest: /tmp/git-delta.deb
  tags: [tools]

- name: Install delta
  become: yes
  ansible.builtin.shell: dpkg -i /tmp/git-delta.deb
  changed_when: false
  tags: [tools]

# --- zoxide: smarter cd (Rust, replaces autojump) ---
- name: Download zoxide
  ansible.builtin.get_url:
    url: 'https://github.com/ajeetdsouza/zoxide/releases/download/v0.10.0/zoxide-0.10.0-x86_64-unknown-linux-musl.tar.gz'
    dest: /tmp/zoxide.tar.gz
  tags: [tools]

- name: Create zoxide extract directory
  ansible.builtin.file:
    path: /tmp/zoxide_extract
    state: directory
    mode: '0755'
  tags: [tools]

- name: Extract zoxide
  ansible.builtin.unarchive:
    src: /tmp/zoxide.tar.gz
    dest: /tmp/zoxide_extract
    remote_src: yes
    creates: /tmp/zoxide_extract/zoxide
  tags: [tools]

- name: Install zoxide binary
  ansible.builtin.copy:
    src: /tmp/zoxide_extract/zoxide
    dest: '{{ ansible_env.HOME }}/.local/bin/zoxide'
    mode: '0755'
    remote_src: yes
  tags: [tools]

