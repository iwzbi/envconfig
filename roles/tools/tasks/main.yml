# Modern CLI tools. ~/.local/bin is shared by both platforms (mise/uv use it).
# Linux: GitHub-release binaries via the shared github_binary role.
# macOS: Homebrew (install.sh owns uv on both platforms — D006).
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [tools]

- name: Install tools for the current OS
  ansible.builtin.include_tasks: "{{ ansible_facts.system | lower }}.yml"
  tags: "{{ ['tools'] + (github_tools | map(attribute='name') | list) }}"
