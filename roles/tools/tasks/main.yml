  when: eza_download.changed
  tags: [tools]

# --- dust: modern du with tree view (Rust) ---
- name: Download dust v{{ dust_version }}
  ansible.builtin.get_url:
    url: 'https://github.com/bootandy/dust/releases/download/v{{ dust_version }}/dust-v{{ dust_version }}-x86_64-unknown-linux-gnu.tar.gz'
    dest: '/tmp/dust-v{{ dust_version }}.tar.gz'
  register: dust_download
  tags: [tools]

- name: Create dust extract directory
  ansible.builtin.file:
    path: '/tmp/dust-v{{ dust_version }}_extract'
    state: directory
    mode: '0755'
  when: dust_download.changed
  tags: [tools]

- name: Extract dust
  ansible.builtin.unarchive:
    src: '/tmp/dust-v{{ dust_version }}.tar.gz'
    dest: '/tmp/dust-v{{ dust_version }}_extract'
    remote_src: yes
  when: dust_download.changed
  tags: [tools]

- name: Find dust binary in extracted archive
  ansible.builtin.find:
    paths: '/tmp/dust-v{{ dust_version }}_extract'
    patterns: 'dust'
    file_type: file
    recurse: yes
  register: dust_binary
  when: dust_download.changed
  tags: [tools]

- name: Install dust binary
  ansible.builtin.copy:
    src: '{{ dust_binary.files[0].path }}'
    dest: '{{ ansible_facts.user_dir }}/.local/bin/dust'
    mode: '0755'
    remote_src: yes
  when: dust_download.changed
  tags: [tools]

# --- lazydocker: Docker TUI (Go binary, same author as lazygit) ---
- name: Download lazydocker v{{ lazydocker_version }}
  ansible.builtin.get_url:
    url: 'https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz'
    dest: '/tmp/lazydocker-v{{ lazydocker_version }}.tar.gz'
  register: lazydocker_download
  tags: [tools]

- name: Create lazydocker extract directory
  ansible.builtin.file:
    path: '/tmp/lazydocker-v{{ lazydocker_version }}_extract'
    state: directory
    mode: '0755'
  when: lazydocker_download.changed
  tags: [tools]

- name: Extract lazydocker
  ansible.builtin.unarchive:
    src: '/tmp/lazydocker-v{{ lazydocker_version }}.tar.gz'
    dest: '/tmp/lazydocker-v{{ lazydocker_version }}_extract'
    remote_src: yes
  when: lazydocker_download.changed
  tags: [tools]

- name: Install lazydocker binary
  become: yes
  ansible.builtin.copy:
    src: '/tmp/lazydocker-v{{ lazydocker_version }}_extract/lazydocker'
    dest: /usr/local/bin/lazydocker
    mode: '0755'
    remote_src: yes
  when: lazydocker_download.changed
  tags: [tools]

# --- uv: ultra-fast Python package manager (always latest via install script) ---
- name: Install uv
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: '{{ ansible_facts.user_dir }}/.local/bin/uv'
  environment:
    UV_INSTALL_DIR: '{{ ansible_facts.user_dir }}/.local/bin'
  tags: [tools]
