# Deploys .zshrc, .tmux.conf, .gitconfig from conf/ (authoritative — D002:
# edit conf/, not ~). .p10k.zsh is copied only if missing (force: false) so
# per-machine p10k choices persist.
#
# Backup policy: instead of `backup: true` (which drops a timestamped
# ~/.zshrc.1234~ on EVERY content change and accumulates forever), preserve
# each pre-existing dotfile ONCE as ~/.zshrc.standup.bak — written only if
# the original exists and no .bak exists yet. This protects a one-time
# first-adoption overwrite without cluttering ~ on every re-run.
- name: Find configuration files
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/conf"
    hidden: true
    file_type: file
  register: configs_conf_files
  tags: [configs]

- name: Preserve pre-existing dotfiles (one-time backup, never accumulates)
  ansible.builtin.shell: |
    src="{{ ansible_facts.user_dir }}/{{ item.path | basename }}"
    bak="{{ ansible_facts.user_dir }}/{{ item.path | basename }}.standup.bak"
    [ -f "$src" ] && [ ! -f "$bak" ] && cp -a "$src" "$bak" || true
  args:
    executable: /bin/bash
  loop: "{{ configs_conf_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename != ".p10k.zsh"
  changed_when: false
  tags: [configs]

- name: Copy managed configuration files (authoritative)
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.user_dir }}/{{ item.path | basename }}"
    mode: "0644"
  loop: "{{ configs_conf_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename != ".p10k.zsh"
  tags: [configs]

- name: Copy personalized p10k config (only if missing)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/conf/.p10k.zsh"
    dest: "{{ ansible_facts.user_dir }}/.p10k.zsh"
    mode: "0644"
    force: false
  tags: [configs]
