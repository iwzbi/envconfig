- name: Find configuration files
  ansible.builtin.find:
    paths: '{{ playbook_dir }}/conf'
    hidden: true
    file_type: file
  register: conf_files
  tags: [configs]

- name: Copy managed configuration files (authoritative)
  ansible.builtin.copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_user_dir }}/{{ item.path | basename }}'
  loop: '{{ conf_files.files }}'
  loop_control:
    label: '{{ item.path | basename }}'
  when: item.path | basename != '.p10k.zsh'
  tags: [configs]

- name: Copy personalized p10k config (only if missing)
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/conf/.p10k.zsh'
    dest: '{{ ansible_user_dir }}/.p10k.zsh'
    force: no
  tags: [configs]
