# Set login shell to zsh. On macOS zsh has been the default since Catalina,
# so this is Linux-only (D004). The ansible user module is idempotent: if the
# shell is already /bin/zsh it reports ok, not changed.
- name: Set login shell to zsh (Linux only)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /bin/zsh
  when: ansible_facts.system == "Linux"
  tags: [shell]
