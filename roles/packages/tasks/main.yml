- name: Install OS packages
  become: yes
  ansible.builtin.package:
    name:
      - vim
      - git
      - zsh
      - curl
      - wget
      - tmux
      - autojump
      - cargo
      - unzip
      - ripgrep
      - fd-find
      - lsof
      - bat
      - jq
      - btop
      - direnv
      - gh
    state: present
  tags: [packages]

- name: Deploy .gitconfig early (before any git clone operations)
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/conf/.gitconfig'
    dest: '{{ ansible_facts.user_dir }}/.gitconfig'
    mode: '0644'
  tags: [packages]
