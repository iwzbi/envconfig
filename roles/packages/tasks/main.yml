# OS-agnostic: deploy .gitconfig early (before any git clone in later roles),
# then dispatch to the OS-specific package list.
- name: Deploy .gitconfig early (before any git clone operations)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/conf/.gitconfig"
    dest: "{{ ansible_facts.user_dir }}/.gitconfig"
    mode: "0644"
  tags: [packages]

- name: Install OS packages
  ansible.builtin.include_tasks: "{{ ansible_facts.system | lower }}.yml"
  tags: [packages]
