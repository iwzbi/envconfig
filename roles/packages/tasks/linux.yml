# Ubuntu/Debian apt packages. `autojump` lives in the `universe` component
# (enabled by default on stock Ubuntu 22.04 and 24.04). `gh` is NOT here — it
# is absent from 22.04's default archives, so it is installed from its GitHub
# .deb by the `tools` role (see vars/versions.yml :: github_tools).
#
# Proxy bypass in one task: corporate proxies often 403 on Ubuntu apt mirrors.
# When a proxy is set in the environment we drop a 99no-proxy apt.conf.d snippet
# so apt ignores it and goes direct to the mirrors (usually reachable even when
# the proxy is needed for GitHub/PyPI). When NO proxy is set, the file renders
# empty (harmless — apt ignores empty apt.conf.d files) instead of leaving a
# stale DIRECT that would override a user's intentional apt-proxy config.
- name: Bypass proxy for apt when a proxy is configured
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99no-proxy
    content: |
      {% if (lookup('ansible.builtin.env', 'http_proxy') | length > 0)
         or (lookup('ansible.builtin.env', 'https_proxy') | length > 0)
         or (lookup('ansible.builtin.env', 'HTTP_PROXY') | length > 0)
         or (lookup('ansible.builtin.env', 'HTTPS_PROXY') | length > 0) %}
      Acquire::http::Proxy "DIRECT";
      Acquire::https::Proxy "DIRECT";
      {% endif %}
    mode: "0644"
    owner: root
    group: root
  tags: [packages]

- name: Install apt packages
  become: true
  ansible.builtin.package:
    name:
      - vim
      - git
      - zsh
      - curl
      - wget
      - tmux
      - autojump
      - cargo
      - unzip
      - ripgrep
      - fd-find
      - lsof
      - bat
      - jq
      - btop
      - direnv
    state: present
  tags: [packages]
