- name: Download opencode install script
  ansible.builtin.get_url:
    url: https://opencode.ai/install
    dest: /tmp/install_opencode.sh
    mode: '0755'
  tags: [opencode]

- name: Install opencode (always latest, skips when current)
  ansible.builtin.shell: /tmp/install_opencode.sh --no-modify-path
  environment:
    PATH: '{{ ansible_facts.env.HOME }}/.opencode/bin:{{ ansible_facts.env.PATH }}'
  register: opencode_install
  changed_when: "'already installed' not in opencode_install.stdout"
  tags: [opencode]

- name: Find pre-saved opencode config files
  ansible.builtin.find:
    paths: '{{ playbook_dir }}/conf/opencode'
    hidden: true
    file_type: file
  register: opencode_conf_files
  tags: [opencode]

- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts.env.HOME }}/.config/opencode'
    state: directory
    mode: '0755'
  tags: [opencode]

- name: Sync pre-saved opencode configs (authoritative)
  ansible.builtin.copy:
    src: '{{ item.path }}'
    dest: '{{ ansible_facts.env.HOME }}/.config/opencode/{{ item.path | basename }}'
    mode: '0644'
  loop: '{{ opencode_conf_files.files }}'
  loop_control:
    label: '{{ item.path | basename }}'
  tags: [opencode]

- name: Ensure omo config directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts.env.HOME }}/.omo'
    state: directory
    mode: '0755'
  tags: [opencode]

- name: Sync oh-my-openagent omo.jsonc (authoritative)
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/conf/omo/omo.jsonc'
    dest: '{{ ansible_facts.env.HOME }}/.omo/omo.jsonc'
    mode: '0644'
  tags: [opencode]
