# opencode CLI via npm under mise's node (replaces the old nvm-sourcing path —
# D003). Always @latest (user preference) — npm re-checks the registry each
# run, so this may report a cosmetic changed=1; that's accepted in exchange
# for always having the newest opencode. Configs are synced authoritatively
# from conf/opencode/ — pre-existing files get a one-time .standup.bak
# (mirrors the configs role, see D002). Uses ansible_facts.user_dir (NOT the
# deprecated ansible_facts.env.HOME).

- name: Install opencode via npm (always latest)
  ansible.builtin.shell: |
    {{ ansible_facts.user_dir }}/.local/bin/mise exec -- npm install -g opencode-ai@latest
  args:
    executable: /bin/bash
  register: opencode_install
  changed_when: "opencode_install.stdout is search('(added|removed|changed) [0-9]+ package')"
  tags: [opencode]

# Verify the CLI actually resolves inside mise's shimmed node tree. The
# install reports success even when a stale ~/.npmrc 'prefix=' diverted it
# off-PATH, and a leftover ~/.npm-global/bin/opencode symlink + PATH export
# can shadow mise's correct copy (D014/D015). failed_when:false on the resolve
# keeps a missing opencode from masking the assert's clear remediation msg.
- name: Resolve opencode path via mise (D015)
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.local/bin/mise exec -- which opencode"
  register: opencode_resolved
  changed_when: false
  failed_when: false
  tags: [opencode]

- name: Verify opencode resolves inside mise's node tree (D015)
  ansible.builtin.assert:
    that:
      - opencode_resolved.stdout.startswith(mise_node_prefix)
    fail_msg: >-
      opencode did NOT resolve inside mise's node tree (got:
      '{{ opencode_resolved.stdout | default("<empty>", true) }}'). Either a
      stale ~/.npmrc 'prefix=' diverted the npm -g install off-PATH, or an old
      ~/.npm-global/bin/opencode symlink is shadowing mise's correct install.
      Fix: (1) 'mise exec -- npm config delete prefix';
      (2) remove any ~/.npm-global/bin/opencode symlink; (3) start a new
      shell ('exec zsh'); (4) re-run ./install.sh --tags opencode. See D015.
  vars:
    mise_node_prefix: "{{ ansible_facts.user_dir }}/.local/share/mise/"
  tags: [opencode]

- name: Find pre-saved opencode config files
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/conf/opencode"
    hidden: true
    file_type: file
  register: opencode_conf_files
  tags: [opencode]

- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/opencode"
    state: directory
    mode: "0755"
  tags: [opencode]

- name: Preserve pre-existing opencode configs (one-time backup)
  ansible.builtin.shell: |
    src="{{ ansible_facts.user_dir }}/.config/opencode/{{ item.path | basename }}"
    bak="${src}.standup.bak"
    [ -f "$src" ] && [ ! -f "$bak" ] && cp -a "$src" "$bak" || true
  args:
    executable: /bin/bash
  loop: "{{ opencode_conf_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  tags: [opencode]

- name: Sync pre-saved opencode configs (authoritative)
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.user_dir }}/.config/opencode/{{ item.path | basename }}"
    mode: "0644"
  loop: "{{ opencode_conf_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: [opencode]

- name: Ensure omo config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.omo"
    state: directory
    mode: "0755"
  tags: [opencode]

- name: Preserve pre-existing omo.jsonc (one-time backup)
  ansible.builtin.shell: |
    src="{{ ansible_facts.user_dir }}/.omo/omo.jsonc"
    bak="${src}.standup.bak"
    [ -f "$src" ] && [ ! -f "$bak" ] && cp -a "$src" "$bak" || true
  args:
    executable: /bin/bash
  changed_when: false
  tags: [opencode]

- name: Sync oh-my-openagent omo.jsonc (authoritative)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/conf/omo/omo.jsonc"
    dest: "{{ ansible_facts.user_dir }}/.omo/omo.jsonc"
    mode: "0644"
  tags: [opencode]
