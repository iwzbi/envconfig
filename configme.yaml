- name: Configure once for all!
  hosts: localhost
  connection: local
  vars_files:
    - vars/versions.yml
  roles:
    - role: homebrew
      when: ansible_facts.system == "Darwin"
    - packages
    - tools
    - mise
    - neovim
    - ohmyzsh
    - astrovim
    - fzf
    - lazygit
    - tmux-plugins
    - configs
    - opencode
    - shell
