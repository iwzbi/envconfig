name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ansible-playbook configme.yaml --syntax-check
      - run: uv run ansible-lint

  # Linux: build the Docker sandbox and run the playbook twice inside it.
  # The second run must not fail — that proves idempotency (changed is fine;
  # failed is not). Matrix covers Ubuntu 22.04 and 24.04 (the Dockerfile takes
  # a BASE_IMAGE build-arg); 22.04 catches e.g. packages absent from jammy.
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BASE_IMAGE=ubuntu:${{ matrix.base }} -t envconfig-test-${{ matrix.base }} .
      - name: Run playbook twice (idempotency gate)
        run: |
          docker run --rm envconfig-test-${{ matrix.base }} bash -lc '
            ansible-playbook configme.yaml &&
            echo "=== second run: idempotency check ===" &&
            ansible-playbook configme.yaml'

  # macOS (Apple Silicon): install.sh already handles brew+uv bootstrap.
  # Run twice — second run must not fail. Validates the macOS path and
  # idempotency on the platform we can't test in Docker.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run install.sh twice (idempotency gate)
        run: |
          ./install.sh
          echo "=== second run: idempotency check ==="
          ./install.sh
